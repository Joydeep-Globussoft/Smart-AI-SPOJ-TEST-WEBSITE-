services:
  - type: web
    name: smart-ai-spoj-test-website-backend
    env: node
    plan: starter
    rootDir: ai-proctored-test-platform/server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
