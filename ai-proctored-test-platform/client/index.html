<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Globussoft AI Proctored Test Platform</title>
    <script>
      (function() {
        try {
          var isCandidateRoute = window.location.pathname.indexOf('/candidate') === 0;
          if (isCandidateRoute) {
            document.documentElement.setAttribute('data-theme', 'light');
            return;
          }
          var v = localStorage.getItem('theme_version');
          if (v !== '2') {
            localStorage.setItem('theme_version', '2');
            localStorage.setItem('admin_theme', 'dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            return;
          }
          var saved = localStorage.getItem('admin_theme');
          if (saved === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
